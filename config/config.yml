project:
  name: xcanids-bigquery-native

bigquery:
  project_id: project-e6de9b55-41d5-4f13-ae0
  location: europe-southwest1
  datasets:
    bronze_ml: can_ids_bronze_ml
    bronze_analytics: can_ids_bronze_analytics
    silver_ml: can_ids_silver_ml
    silver_analytics: can_ids_silver_analytics
    gold_ml: can_ids_gold_ml
    gold_analytics: can_ids_gold_analytics
    audit: can_ids_audit

gcs_paths:
  landing:
    raw: gs://can-ids-data/landing/raw/
    signal: gs://can-ids-data/landing/signal/

quality_rules:
  raw:
    arbitration_id:
      min: 0
      max: 2047
    dlc:
      min: 0
      max: 8
    label:
      allowed: [0, 1]
  signal:
    label:
      allowed: [0, 1]

ingestion:
  skip_existing_files: true
